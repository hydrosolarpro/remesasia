project_id = "remesas-ia"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]

[db]
port = 54322

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# SMS OTP (F: autenticación por teléfono) — configura el proveedor SMS
# (Twilio/MessageBird/Vonage) desde el dashboard: Authentication > Providers > Phone.
[auth.sms]
enable_signup = true
enable_confirmations = true

[realtime]
enabled = true

[storage]
enabled = true

# Telegram llama a este webhook directamente (no puede mandar un JWT de
# Supabase) -- la seguridad la da la validación del secret_token propio de
# Telegram dentro de la función (ver supabase/functions/telegram-webhook).
[functions.telegram-webhook]
verify_jwt = false
