name: keep-alive-supabase

# Evita que Supabase pause el proyecto por inactividad (free tier: 7 días sin
# requests a la API). Hace un "ping" mínimo a la REST API una vez al día.

on:
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC a diario (01:17 Perú). No usar 0 * * * *: GitHub congestiona el minuto 0.
  workflow_dispatch: {}     # permite lanzarlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping REST API de Supabase
        env:
          SUPABASE_URL: https://vddyynachdgqmtofqxnr.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/body.txt -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/tasas?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $code"
          cat /tmp/body.txt; echo
          case "$code" in
            2*) echo "keep-alive OK" ;;
            *)  echo "keep-alive FALLO (HTTP $code)"; exit 1 ;;
          esac
